<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            display: flex;
            background-color: rgb(201, 147, 103);
            flex-flow: row nowrap;
        }

        div.item {
            border: 1px solid black;
            background-color: aqua;
            padding: 20px;
        }

        /* C G D B A E F */

        #i1{
             order: 4;
        }

        #i2{
             order: 2;
        }

        #i3{
             order: -3;
        }
 
        #i4{
             order: 1;
        }

        #i5{
            order: 7;
        }
        #i6{
             order: 8;
        }
        #i7{
             order: 0;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E</div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G</div>
    </div>
</body>
</html>
