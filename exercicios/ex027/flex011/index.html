<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        div.conteiner {
            display: flex;
            background-color: rgb(201, 147, 103);
            flex-flow: row nowrap;
        }

        div.item {
            flex-basis: 200px;
            border: 1px solid black;
            background-color: aqua;
            text-align: center;
        }

        #i1 {
            flex-grow: 8;
            flex-shrink: 0;
        }

        #i2 {
            flex-grow: 2;
            flex-shrink: 4;
        }

        #i3 {
            flex-grow: 0;
            flex-shrink: 1;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
        
    </div>
</body>
</html>
